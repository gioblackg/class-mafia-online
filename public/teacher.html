<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>교사 진행판 · 우리 반 마피아</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap minimal-wrap">
  <div class="topbar minimal-topbar">
    <div class="brand"><div class="brand-badge">M</div>우리 반 마피아 <span class="pill live">교사</span></div>
    <div class="inline"><span id="topRoom" class="room-chip"></span><a href="/" class="btn btn-light compact-btn">처음으로</a></div>
  </div>
  <div id="fatal" class="notice error" hidden></div>

  <main id="app" class="minimal-dashboard" hidden>
    <aside class="stack minimal-side">
      <section class="card room-card-min">
        <div class="small muted">학생 입장</div>
        <div id="roomCode" class="code compact-code"></div>
        <button id="openQrBtn" class="qr-open-button" type="button" title="QR 크게 보기"><img id="qr" class="qr compact-qr" alt="학생 입장 QR"><span class="qr-open-hint">🔍 크게 보기</span></button>
        <button id="copyUrlBtn" class="btn btn-light btn-block">🔗 접속 주소 복사</button>
        <div class="mini-stats"><span>입장 <b id="statPlayers">0</b></span><span>생존 <b id="statAlive">0</b></span><span><b id="statDay">1</b>일차</span></div>
      </section>

      <section id="roleSetup" class="card compact-card">
        <h2>게임 준비</h2>
        <div id="roleSetupFields">
          <div class="role-settings compact-settings">
            <div class="field"><label>마피아</label><input id="mafiaN" class="input" type="number" min="1" value="2"></div>
            <div class="field"><label>경찰</label><input id="policeN" class="input" type="number" min="0" value="1"></div>
            <div class="field"><label>의사</label><input id="doctorN" class="input" type="number" min="0" value="1"></div>
          </div>
          <div class="total-days-row"><label for="totalDays">총 진행 일수</label><div class="total-days-control"><input id="totalDays" class="input" type="number" min="1" max="30" value="5"><span>일</span></div></div>
          <label class="toggle small"><input id="mafiaKnow" type="checkbox" checked> 마피아끼리 서로 확인</label>
        </div>
        <button id="assignBtn" class="btn btn-primary btn-block">역할 부여</button>
        <div id="roleAfterAssign" class="stack" style="gap:8px;margin-top:10px" hidden>
          <button id="openRolesBtn" class="btn btn-light btn-block">📋 전체 역할 새창</button>
          <button id="studentLockBtn" class="btn btn-secondary btn-block" disabled>🔒 역할 잠금</button>
        </div>
        <div id="roleMsg" hidden style="margin-top:10px"></div>
      </section>

      <details class="card tool-details">
        <summary>🧪 테스트 도구</summary>
        <div class="details-body">
          <div class="inline test-add-row"><input id="virtualN" class="input test-count" type="number" min="1" max="12" value="6"><button id="addVirtualBtn" class="btn btn-secondary">가상 학생 추가</button></div>
          <button id="clearVirtualBtn" class="btn btn-light btn-block" style="margin-top:8px">가상 학생 삭제</button>
          <div id="testActions" class="stack" style="gap:8px;margin-top:10px"></div>
          <div id="testMsg" hidden style="margin-top:10px"></div>
        </div>
      </details>

      <details class="card tool-details">
        <summary>⚙️ 게임 관리</summary>
        <div class="details-body stack" style="gap:8px">
          <button id="resetBtn" class="btn btn-light btn-block">게임 초기화</button>
          <button id="deleteBtn" class="btn btn-danger btn-block">방 종료</button>
        </div>
      </details>
    </aside>

    <section class="stack minimal-main">
      <section class="card progress-card">
        <div class="section-title compact-title"><div><div class="small muted">현재 진행</div><h2 id="flowTitle">게임 준비</h2></div><span id="flowPill" class="pill"></span></div>
        <div id="flowArea"></div>
        <div id="voteMsg" hidden style="margin-top:10px"></div>
        <div id="nightMsg" hidden style="margin-top:10px"></div>
      </section>

      <details class="card tool-details history-details">
        <summary>📋 지난 기록</summary>
        <div id="history" class="details-body"></div>
      </details>
    </section>
  </main>
</div>
<div id="qrModal" class="qr-modal" hidden aria-modal="true" role="dialog" aria-label="학생 입장 QR 크게 보기">
  <button id="closeQrBtn" class="qr-modal-close" type="button" aria-label="닫기">×</button>
  <div class="qr-modal-panel">
    <div class="qr-modal-head"><div class="small muted">우리 반 마피아 · 학생 입장</div><div id="qrModalCode" class="qr-modal-code"></div></div>
    <img id="qrLarge" class="qr-large" alt="학생 입장 QR 크게 보기">
    <div class="qr-roster">
      <div class="qr-roster-summary">현재 접속 <b id="qrConnectedCount">0</b>명 <span id="qrJoinedCount" class="muted"></span></div>
      <div id="qrStudentList" class="qr-student-list"></div>
    </div>
  </div>
</div>
<script src="/common.js"></script>
<script>
const code=new URLSearchParams(location.search).get('room');
const token=localStorage.getItem('mafia_admin_'+code);
let state=null,loading=false;
function h(method,body){return {method,headers:{'x-admin-token':token},body:body?JSON.stringify(body):undefined}}
async function load(force=false){
  if(loading&&!force)return;
  if(!/^\d{6}$/.test(code||'')||!token){fatal('교사 권한 정보를 찾을 수 없습니다. 새 방을 만들어 주세요.');return}
  loading=true;
  try{state=await api('/api/rooms/'+code+'/teacher',{headers:{'x-admin-token':token}});render();qs('#app').hidden=false;qs('#fatal').hidden=true}
  catch(e){fatal(e.message)}finally{loading=false}
}
function fatal(m){qs('#fatal').textContent=m;qs('#fatal').hidden=false;qs('#app').hidden=true}
function renderQrRoster(){
  if(!state)return;
  const real=state.players.filter(p=>!p.virtual),online=real.filter(p=>p.connected);
  qs('#qrConnectedCount').textContent=online.length;
  qs('#qrJoinedCount').textContent=real.length?`· 입장 ${real.length}명`:'';
  qs('#qrStudentList').innerHTML=online.length?online.map(p=>`<span class="qr-student-name"><i></i>${escapeHtml(p.name)}</span>`).join(''):'<span class="small muted">아직 접속한 학생이 없습니다.</span>';
}
function openQrModal(){renderQrRoster();qs('#qrModal').hidden=false;document.body.classList.add('modal-open')}
function closeQrModal(){qs('#qrModal').hidden=true;document.body.classList.remove('modal-open')}
function render(){
  const qrSrc='/api/rooms/'+state.code+'/qr';qs('#roomCode').textContent=state.code;qs('#topRoom').textContent='방 '+state.code;if(qs('#qr').getAttribute('src')!==qrSrc){qs('#qr').src=qrSrc;qs('#qrLarge').src=qrSrc}qs('#statPlayers').textContent=state.playerCount;qs('#statAlive').textContent=state.aliveCount;qs('#statDay').textContent=state.totalDays?`${state.day}/${state.totalDays}`:state.day;qs('#qrModalCode').textContent='방 '+state.code;renderQrRoster();
  qs('#roleSetupFields').hidden=state.rolesAssigned;
  qs('#assignBtn').disabled=state.rolesAssigned;
  qs('#assignBtn').textContent=state.rolesAssigned?'✓ 부여 완료':'역할 부여';
  qs('#assignBtn').className=state.rolesAssigned?'btn btn-complete btn-block':'btn btn-primary btn-block';
  ['mafiaN','policeN','doctorN','mafiaKnow','totalDays'].forEach(id=>qs('#'+id).disabled=state.rolesAssigned);
  qs('#roleAfterAssign').hidden=!state.rolesAssigned;
  qs('#openRolesBtn').disabled=!state.rolesAssigned;
  qs('#studentLockBtn').disabled=!state.rolesAssigned;qs('#studentLockBtn').textContent=state.roleLocked?'🔓 역할 열기':'🔒 역할 잠금';
  renderFlow();renderHistory();renderTest();
}
function setFlow(title,pill,html,pillClass=''){
  qs('#flowTitle').textContent=title;qs('#flowPill').textContent=pill;qs('#flowPill').className='pill '+pillClass;qs('#flowArea').innerHTML=html;
}
function renderFlow(){
  if(!state.rolesAssigned){setFlow('게임 준비','대기','<div class="empty compact-empty">학생이 모이면 왼쪽에서 역할을 배정하세요.</div>');return}
  const n=state.nightAction||{status:'idle',progress:{eligible:0,completed:0}};
  const voteDone=(state.voteHistory||[]).some(h=>h.day===state.day);
  if(n.status==='open'){
    const p=n.progress||{eligible:0,completed:0},allDone=p.eligible>0&&p.completed>=p.eligible;
    setFlow('🌙 밤 행동',`${p.completed}/${p.eligible}명`,`<div class="action-center"><div class="night-moon small-moon">🌙</div><p><b>학생들이 밤 행동 중입니다.</b></p><div class="night-progressbar"><span style="width:${p.eligible?Math.round(p.completed/p.eligible*100):0}%"></span></div><button class="btn btn-primary btn-block" onclick="resolveNight()" ${allDone?'':'disabled'}>밤 결과 확인</button>${allDone?'':'<div class="small muted center-text">모든 생존 학생이 선택하면 확인할 수 있습니다.</div>'}</div>`,'');return;
  }
  if(n.status==='resolved'){
    const r=n.result||{},prs=Array.isArray(r.policeResults)?r.policeResults:[];
    const resultText=r.protected?'🩺 의사가 보호했습니다. 탈락자 없음':r.eliminatedName?`🌙 ${escapeHtml(r.eliminatedName)} 탈락`:'🌙 탈락자 없음';
    const police=prs.length?prs.map(x=>`<div class="result-row"><span>🔎 경찰 조사</span><b>${escapeHtml(x.targetName||'대상 없음')} → ${x.isMafia?'마피아':'마피아 아님'}</b></div>`).join(''):`<div class="result-row"><span>🔎 경찰 조사</span><b>${state.nightCapabilities?.policeAlive?'결과 없음':'생존 경찰 없음'}</b></div>`;
    const finalDay=state.day>=state.totalDays||state.status==='finished';
    const footer=finalDay?`<div class="game-finished-box"><b>🏁 ${state.totalDays}일간의 게임이 끝났습니다.</b><div class="small muted">필요하면 역할 보기로 최종 역할을 확인하세요.</div></div>`:`<button class="btn btn-secondary btn-block" onclick="nextDay()">➡️ ${state.day+1}일차 시작</button>`;
    setFlow('밤 결과',finalDay?'게임 종료':'완료',`<div class="result-hero">${resultText}</div><div class="result-list"><div class="result-row"><span>🔪 마피아</span><b>${escapeHtml(r.mafiaTargetName||'없음')}</b></div><div class="result-row"><span>🩺 의사</span><b>${escapeHtml(r.doctorTargetName||'없음')}</b></div>${police}</div>${footer}`,'live');return;
  }
  if(state.voteStatus==='open'){
    const p=state.voteProgress||{voted:0,eligible:0};
    setFlow(`${state.day}일차 투표`,`${p.voted}/${p.eligible}명`,`<div class="action-center"><p><b>학생들이 투표 중입니다.</b></p><div class="night-progressbar"><span style="width:${p.eligible?Math.round(p.voted/p.eligible*100):0}%"></span></div><button class="btn btn-danger btn-block" onclick="endVote()">투표 종료</button></div>`,'');return;
  }
  if(state.voteStatus==='ended'&&!voteDone){
    const tally=state.tally||[];
    setFlow('투표 결과','탈락 선택',tally.length?`<div class="simple-tally">${tally.map(t=>`<button class="tally-row" ${t.alive?'':'disabled'} onclick="eliminate('${t.playerId}')"><span>${escapeHtml(t.name)}</span><b>${t.votes}표</b></button>`).join('')}</div><div class="inline flow-buttons"><button class="btn btn-light" onclick="startNight()">탈락자 없이 밤으로</button></div>`:`<div class="empty compact-empty">표가 없습니다.</div><button class="btn btn-primary btn-block" onclick="startNight()">🌙 밤 행동 시작</button>`);return;
  }
  if(state.voteStatus==='ended'&&voteDone){
    const h=(state.voteHistory||[]).find(x=>x.day===state.day);
    setFlow('낮 투표 완료',escapeHtml(h?.eliminatedName||'완료'),`<div class="result-hero">${escapeHtml(h?.eliminatedName||'탈락자 없음')} ${h?.eliminatedName&&h.eliminatedName!=='탈락자 없음'?'탈락':''}</div><button class="btn btn-primary btn-block" onclick="startNight()">🌙 밤 행동 시작</button>`,'live');return;
  }
  setFlow(`${state.day}일차 낮`,'토론',`<div class="action-center"><p class="muted">토론이 끝나면 투표를 시작하세요.</p><button class="btn btn-primary btn-block" onclick="startVote()">🗳️ 투표 시작</button></div>`,'');
}
function renderTest(){
  const virtuals=state.players.filter(p=>p.virtual),actions=qs('#testActions');
  qs('#addVirtualBtn').disabled=state.rolesAssigned||state.playerCount>=40;qs('#clearVirtualBtn').disabled=state.rolesAssigned||!virtuals.length;
  const buttons=[];
  if(state.nightAction?.status==='open')buttons.push('<button class="btn btn-secondary btn-block" onclick="autoVirtualNight()">가상 학생 밤 행동 자동</button>');
  if(state.voteStatus==='open')buttons.push('<button class="btn btn-secondary btn-block" onclick="autoVirtualVote()">가상 학생 투표 자동</button>');
  actions.innerHTML=virtuals.length?`<div class="small muted">가상 학생 ${virtuals.length}명</div>${buttons.join('')}`:'<div class="small muted">실제 태블릿 없이 기능을 시험할 때 사용합니다.</div>';
}
function openPreview(id){const p=state.players.find(x=>x.id===id);if(!p?.previewUrl)return;window.open(p.previewUrl,'_blank','noopener')}
function openRolesWindow(){
  if(!state?.rolesAssigned)return;
  const url='/roles.html?room='+encodeURIComponent(code);
  const w=window.open(url,'mafia_roles_'+code,'width=720,height=860,resizable=yes,scrollbars=yes');
  if(!w) alert('새 창이 차단되었습니다. 브라우저의 팝업 허용 후 다시 눌러 주세요.');
}
function renderHistory(){
  const el=qs('#history'),votes=state.voteHistory||[],nights=state.nightHistory||[];
  if(!votes.length&&!nights.length){el.innerHTML='<div class="small muted">아직 기록이 없습니다.</div>';return}
  const days=[...new Set([...votes.map(v=>v.day),...nights.map(n=>n.day)])].sort((a,b)=>b-a);
  el.innerHTML=days.map(d=>{const v=votes.find(x=>x.day===d),n=nights.find(x=>x.day===d),prs=n&&Array.isArray(n.policeResults)?n.policeResults:[];return `<div class="history compact-history"><b>${d}일차</b>${v?`<div class="small">낮 · ${escapeHtml(v.eliminatedName||'탈락자 없음')}</div>`:''}${n?`<div class="small">밤 · ${n.protected?'보호 성공':escapeHtml(n.eliminatedName||'탈락자 없음')}</div><div class="small muted">🔪 ${escapeHtml(n.mafiaTargetName||'없음')} · 🩺 ${escapeHtml(n.doctorTargetName||'없음')}</div>${prs.map(x=>`<div class="small muted">🔎 ${escapeHtml(x.targetName||'대상 없음')} → ${x.isMafia?'마피아':'마피아 아님'}</div>`).join('')}`:''}</div>`}).join('')
}
async function addVirtual(){try{const n=Math.max(1,Math.min(12,+qs('#virtualN').value||6));const r=await api('/api/rooms/'+code+'/test/virtual/add',h('POST',{count:n}));flash(qs('#testMsg'),`가상 학생 ${r.added}명을 추가했습니다.`,'notice success');await load(true)}catch(e){flash(qs('#testMsg'),e.message,'notice error')}}
async function clearVirtual(){if(!confirm('가상 학생을 모두 삭제할까요?'))return;try{const r=await api('/api/rooms/'+code+'/test/virtual/clear',h('POST'));flash(qs('#testMsg'),`가상 학생 ${r.removed}명을 삭제했습니다.`,'notice success');await load(true)}catch(e){flash(qs('#testMsg'),e.message,'notice error')}}
async function autoVirtualNight(){try{const r=await api('/api/rooms/'+code+'/test/virtual/night-auto',h('POST'));flash(qs('#testMsg'),`가상 학생 ${r.acted}명이 완료했습니다.`,'notice success');await load(true)}catch(e){flash(qs('#testMsg'),e.message,'notice error')}}
async function autoVirtualVote(){try{const r=await api('/api/rooms/'+code+'/test/virtual/vote-auto',h('POST'));flash(qs('#testMsg'),`가상 학생 ${r.voted}명이 투표했습니다.`,'notice success');await load(true)}catch(e){flash(qs('#testMsg'),e.message,'notice error')}}
async function assign(){try{await api('/api/rooms/'+code+'/assign',h('POST',{mafia:+qs('#mafiaN').value,police:+qs('#policeN').value,doctor:+qs('#doctorN').value,totalDays:+qs('#totalDays').value||5,mafiaKnowEachOther:qs('#mafiaKnow').checked}));await load(true)}catch(e){flash(qs('#roleMsg'),e.message,'notice error')}}
async function toggleStudentLock(){try{await api('/api/rooms/'+code+'/role-lock',h('POST',{locked:!state.roleLocked}));await load(true)}catch(e){flash(qs('#roleMsg'),e.message,'notice error')}}
async function kick(id){try{await api('/api/rooms/'+code+'/kick',h('POST',{playerId:id}));await load(true)}catch(e){alert(e.message)}}
async function startVote(){try{await api('/api/rooms/'+code+'/vote/start',h('POST'));await load(true)}catch(e){flash(qs('#voteMsg'),e.message,'notice error')}}
async function endVote(){try{await api('/api/rooms/'+code+'/vote/end',h('POST'));await load(true)}catch(e){flash(qs('#voteMsg'),e.message,'notice error')}}
async function eliminate(id){const name=state.players.find(p=>p.id===id)?.name||'이 학생';if(!confirm(`${name} 학생을 탈락 처리할까요?`))return;try{await api('/api/rooms/'+code+'/eliminate',h('POST',{playerId:id}));await load(true)}catch(e){flash(qs('#voteMsg'),e.message,'notice error')}}
async function startNight(){if(!confirm('밤 행동을 시작할까요? 학생 역할 화면이 자동으로 잠깁니다.'))return;try{await api('/api/rooms/'+code+'/night/start',h('POST'));await load(true)}catch(e){flash(qs('#nightMsg'),e.message,'notice error')}}
async function resolveNight(){try{const r=await api('/api/rooms/'+code+'/night/resolve',h('POST'));if(r.result?.protected)flash(qs('#nightMsg'),'의사가 보호했습니다. 탈락자는 없습니다.','notice success');await load(true)}catch(e){flash(qs('#nightMsg'),e.message,'notice error')}}
async function nextDay(){try{await api('/api/rooms/'+code+'/day/next',h('POST'));await load(true)}catch(e){flash(qs('#voteMsg'),e.message,'notice error')}}
qs('#copyUrlBtn').onclick=async()=>{try{await navigator.clipboard.writeText(state.joinUrl);qs('#copyUrlBtn').textContent='✅ 복사됨';setTimeout(()=>qs('#copyUrlBtn').textContent='🔗 접속 주소 복사',1200)}catch{prompt('아래 주소를 복사하세요.',state.joinUrl)}};
qs('#openQrBtn').onclick=openQrModal;qs('#closeQrBtn').onclick=closeQrModal;qs('#qrModal').addEventListener('click',e=>{if(e.target===qs('#qrModal'))closeQrModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!qs('#qrModal').hidden)closeQrModal()});
qs('#assignBtn').onclick=assign;qs('#openRolesBtn').onclick=openRolesWindow;qs('#studentLockBtn').onclick=toggleStudentLock;qs('#addVirtualBtn').onclick=addVirtual;qs('#clearVirtualBtn').onclick=clearVirtual;
qs('#resetBtn').onclick=async()=>{if(!confirm('역할과 기록을 모두 초기화할까요?'))return;try{await api('/api/rooms/'+code+'/reset',h('POST'));await load(true)}catch(e){alert(e.message)}};
qs('#deleteBtn').onclick=async()=>{if(!confirm('방을 완전히 종료할까요?'))return;try{await api('/api/rooms/'+code+'/delete',h('POST'));localStorage.removeItem('mafia_admin_'+code);location.href='/'}catch(e){alert(e.message)}};
load();setInterval(load,1500);
</script>
</body>
</html>
