<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사 진행판 · 우리 반 마피아</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="wrap"><div class="topbar"><div class="brand"><div class="brand-badge">M</div>교사 진행판 <span class="pill live">ONLINE</span></div><a href="/" class="btn btn-light">처음으로</a></div>
<div id="fatal" class="notice error" hidden></div><main id="app" class="dashboard" hidden>
<aside class="stack"><section class="card"><div class="small muted">우리 방 코드</div><div id="roomCode" class="code"></div><img id="qr" class="qr" alt="학생 입장 QR"><div class="notice"><b>학생 인터넷 접속 주소</b><br><span id="joinUrl" style="word-break:break-all"></span><div style="margin-top:9px"><button id="copyUrlBtn" class="btn btn-light" style="padding:8px 11px">주소 복사</button></div></div><div class="divider"></div><div class="statrow"><div class="stat"><b id="statPlayers">0</b><span class="small muted">접속</span></div><div class="stat"><b id="statAlive">0</b><span class="small muted">생존</span></div><div class="stat"><b id="statDay">1</b><span class="small muted">일차</span></div></div></section>
<section class="card"><h2 style="font-size:19px">역할 설정</h2><div class="role-settings"><div class="field"><label>마피아</label><input id="mafiaN" class="input" type="number" min="1" value="2"></div><div class="field"><label>경찰</label><input id="policeN" class="input" type="number" min="0" value="1"></div><div class="field"><label>의사</label><input id="doctorN" class="input" type="number" min="0" value="1"></div></div><label class="toggle"><input id="mafiaKnow" type="checkbox" checked> 마피아끼리 서로 확인</label><button id="assignBtn" class="btn btn-primary btn-block">🎲 역할 배정하기</button><div id="roleMsg" hidden style="margin-top:10px"></div></section>
<section class="card"><h2 style="font-size:19px">게임 관리</h2><div class="stack" style="gap:9px;margin-top:12px"><button id="resetBtn" class="btn btn-light btn-block">게임 초기화</button><button id="deleteBtn" class="btn btn-danger btn-block">방 종료하기</button></div></section></aside>
<section class="stack"><section class="card"><div class="section-title"><div><h2>학생 현황</h2><p class="small muted" style="margin:5px 0 0">역할은 기본적으로 가려져 있습니다. 필요할 때만 교사 화면에서 확인하세요.</p></div><span id="statePill" class="pill">대기 중</span></div><div class="inline" style="margin-bottom:14px"><button id="teacherRoleBtn" class="btn btn-light">👁 역할 보기</button><button id="studentLockBtn" class="btn btn-secondary" disabled>🔒 학생 역할 잠금</button><span id="lockState" class="pill">학생 역할 열림</span></div><div id="playerList" class="player-list"></div></section>
<section class="card"><div class="section-title"><div><h2><span id="voteDay">1</span>일차 마피아 투표</h2><p class="small muted" style="margin:5px 0 0">생존 학생이 한 명씩 마피아라고 생각하는 친구에게 투표합니다.</p></div><span id="voteProgress" class="pill">0/0명</span></div><div id="voteControls" class="inline"></div><div id="voteArea" style="margin-top:16px"></div><div id="voteMsg" hidden style="margin-top:10px"></div></section>
<section class="card"><div class="section-title"><div><h2>🌙 밤 진행 · 교사용</h2><p class="small muted" style="margin:5px 0 0">마피아가 지목한 학생과 의사가 보호한 학생을 각각 체크해 두세요.</p></div><span id="nightDay" class="pill">1일차 밤</span></div><div id="nightArea"></div><div id="nightMsg" hidden style="margin-top:10px"></div></section>
<section class="card"><div class="section-title"><h2>지난 기록</h2></div><div id="history"></div></section></section></main></div>
<script src="/common.js"></script><script>
const code=new URLSearchParams(location.search).get('room'); const token=localStorage.getItem('mafia_admin_'+code); let state=null; let loading=false; let showTeacherRoles=false; let nightSavePromise=Promise.resolve();
function h(method,body){return {method,headers:{'x-admin-token':token},body:body?JSON.stringify(body):undefined}}
async function load(force=false){if(loading&&!force)return;if(!/^\d{6}$/.test(code||'')||!token){fatal('교사 권한 정보를 찾을 수 없습니다. 새 방을 만들어 주세요.');return}loading=true;try{state=await api('/api/rooms/'+code+'/teacher?showRoles='+(showTeacherRoles?'1':'0'),{headers:{'x-admin-token':token}});render();qs('#app').hidden=false;qs('#fatal').hidden=true;}catch(e){fatal(e.message)}finally{loading=false}}
function fatal(m){qs('#fatal').textContent=m;qs('#fatal').hidden=false;qs('#app').hidden=true}
function roleBadge(p){if(!state.rolesAssigned)return '';if(!showTeacherRoles)return '<span class="role role-hidden">•••</span>';return p.role&&roleMeta[p.role]?`<span class="role ${p.role}">${roleMeta[p.role].label}</span>`:'<span class="role role-hidden">?</span>'}
function render(){qs('#roomCode').textContent=state.code;qs('#qr').src='/api/rooms/'+state.code+'/qr?t='+Date.now();qs('#joinUrl').textContent=state.joinUrl||'';qs('#statPlayers').textContent=state.playerCount;qs('#statAlive').textContent=state.aliveCount;qs('#statDay').textContent=state.day;qs('#voteDay').textContent=state.day;qs('#nightDay').textContent=state.day+'일차 밤';qs('#voteProgress').textContent=`${state.voteProgress.voted}/${state.voteProgress.eligible}명`;
const pill=qs('#statePill');pill.textContent=state.rolesAssigned?`${state.day}일차 진행 중`:'학생 입장 대기';pill.className='pill '+(state.rolesAssigned?'live':'');qs('#assignBtn').disabled=state.rolesAssigned;['mafiaN','policeN','doctorN','mafiaKnow'].forEach(id=>qs('#'+id).disabled=state.rolesAssigned);
qs('#teacherRoleBtn').disabled=!state.rolesAssigned;qs('#teacherRoleBtn').textContent=showTeacherRoles?'🙈 역할 가리기':'👁 역할 보기';qs('#studentLockBtn').disabled=!state.rolesAssigned;qs('#studentLockBtn').textContent=state.roleLocked?'🔓 학생 역할 다시 열기':'🔒 학생 역할 잠금';qs('#lockState').textContent=state.roleLocked?'학생 역할 잠김':'학생 역할 열림';qs('#lockState').className='pill '+(state.roleLocked?'dead':'live');
qs('#playerList').innerHTML=state.players.length?state.players.map(p=>`<div class="player"><div><div class="name">${escapeHtml(p.name)} ${p.connected?'<span class="pill live">접속</span>':''}</div><div class="small muted">${p.alive?'생존':'탈락'} ${p.hasVoted?'· 투표 완료':''}</div></div>${roleBadge(p)}${!state.rolesAssigned?`<button class="btn btn-danger kick" onclick="kick('${p.id}')">내보내기</button>`:`<span class="pill ${p.alive?'live':'dead'}">${p.alive?'생존':'탈락'}</span>`}</div>`).join(''):'<div class="empty">아직 입장한 학생이 없습니다.<br>QR을 화면에 보여 주세요.</div>';
renderVote();renderNight();renderHistory();}
function renderVote(){const c=qs('#voteControls'),a=qs('#voteArea');if(!state.rolesAssigned){c.innerHTML='';a.innerHTML='<div class="empty">역할을 배정하면 일차별 투표를 시작할 수 있습니다.</div>';return}if(state.voteStatus==='idle'){c.innerHTML='<button class="btn btn-primary" onclick="startVote()">🗳️ 투표 시작</button>';a.innerHTML='<div class="empty">토론이 끝나면 투표를 시작하세요.</div>';}
else if(state.voteStatus==='open'){c.innerHTML='<button class="btn btn-danger" onclick="endVote()">⏹ 투표 종료</button>';a.innerHTML=`<div class="status-banner status-vote">학생들이 투표 중입니다 · ${state.voteProgress.voted}/${state.voteProgress.eligible}명 완료</div>`;}
else{c.innerHTML='<button class="btn btn-secondary" onclick="nextDay()">➡️ 다음 일차</button>';const tally=state.tally||[],done=state.voteHistory.some(h=>h.day===state.day);a.innerHTML=tally.length?`<div class="vote-grid">${tally.map(t=>`<div class="candidate"><div class="small muted">${escapeHtml(t.name)}</div><div class="votes">${t.votes}표</div>${done?'<span class="pill live">처리 완료</span>':(t.alive?`<button class="btn btn-danger" style="margin-top:10px" onclick="eliminate('${t.playerId}')">탈락 처리</button>`:'<span class="pill dead">이미 탈락</span>')}</div>`).join('')}</div><p class="small muted">동률이면 결과를 보고 선생님이 탈락자를 선택할 수 있습니다. 탈락자를 정하지 않고 다음 일차로 넘어갈 수도 있습니다.</p>`:'<div class="empty">표가 없습니다. 다음 일차로 넘어갈 수 있습니다.</div>';}}
function renderNight(){const el=qs('#nightArea');if(!state.rolesAssigned){el.innerHTML='<div class="empty">역할을 배정하면 밤 진행 체크표가 열립니다.</div>';return}const n=state.nightAction||{};if(n.resolved){const r=n.result||{};el.innerHTML=`<div class="status-banner ${r.protected?'status-done':'status-vote'}">${r.protected?'🩺 의사의 보호 성공 · 탈락 없음':r.eliminatedName?`🌙 ${escapeHtml(r.eliminatedName)} 학생이 밤에 탈락했습니다.`:'🌙 이번 밤에는 탈락자가 없습니다.'}</div><div class="night-summary"><span>마피아 지목: <b>${escapeHtml(r.mafiaTargetName||'없음')}</b></span><span>의사 보호: <b>${escapeHtml(r.doctorTargetName||'없음')}</b></span></div>`;return}
const alive=state.players.filter(p=>p.alive);el.innerHTML=`<div class="night-table"><div class="night-head"><span>학생</span><span>🔪 마피아 지목</span><span>🩺 의사 보호</span></div>${alive.map(p=>`<div class="night-row"><span class="night-name">${escapeHtml(p.name)}</span><label class="night-choice"><input type="radio" name="mafiaNight" value="${p.id}" ${n.mafiaTargetId===p.id?'checked':''} onchange="saveNight()"><span></span></label><label class="night-choice"><input type="radio" name="doctorNight" value="${p.id}" ${n.doctorTargetId===p.id?'checked':''} onchange="saveNight()"><span></span></label></div>`).join('')}</div><div class="inline" style="margin-top:14px"><button class="btn btn-light" onclick="clearNight()">선택 지우기</button><button class="btn btn-primary" onclick="resolveNight()">🌙 밤 결과 적용</button></div><p class="small muted">마피아 지목과 의사 보호가 같은 학생이면 보호 성공으로 처리됩니다. 다르면 마피아가 지목한 학생이 자동으로 탈락합니다.</p>`;}
function renderHistory(){const el=qs('#history');const votes=state.voteHistory||[],nights=state.nightHistory||[];if(!votes.length&&!nights.length){el.innerHTML='<div class="empty">아직 종료된 기록이 없습니다.</div>';return}const days=[...new Set([...votes.map(v=>v.day),...nights.map(n=>n.day)])].sort((a,b)=>b-a);el.innerHTML=days.map(d=>{const v=votes.find(x=>x.day===d),n=nights.find(x=>x.day===d);return `<div class="history"><b>${d}일차</b>${v?` · 낮 탈락: <b>${escapeHtml(v.eliminatedName||'없음')}</b><div class="small muted">${(v.tally||[]).map(t=>`${escapeHtml(t.name)} ${t.votes}표`).join(' · ')||'투표 없음'}</div>`:''}${n?`<div class="small" style="margin-top:5px">🌙 마피아 지목 <b>${escapeHtml(n.mafiaTargetName||'없음')}</b> · 의사 보호 <b>${escapeHtml(n.doctorTargetName||'없음')}</b> · 결과 <b>${n.protected?'보호 성공':escapeHtml(n.eliminatedName||'탈락 없음')}</b></div>`:''}</div>`}).join('')}
async function assign(){try{await api('/api/rooms/'+code+'/assign',h('POST',{mafia:+qs('#mafiaN').value,police:+qs('#policeN').value,doctor:+qs('#doctorN').value,mafiaKnowEachOther:qs('#mafiaKnow').checked}));await load(true);}catch(e){flash(qs('#roleMsg'),e.message,'notice error')}}
async function toggleTeacherRoles(){showTeacherRoles=!showTeacherRoles;await load(true)}
async function toggleStudentLock(){try{await api('/api/rooms/'+code+'/role-lock',h('POST',{locked:!state.roleLocked}));await load(true)}catch(e){flash(qs('#roleMsg'),e.message,'notice error')}}
async function kick(id){try{await api('/api/rooms/'+code+'/kick',h('POST',{playerId:id}));await load(true)}catch(e){alert(e.message)}}
async function startVote(){try{await api('/api/rooms/'+code+'/vote/start',h('POST'));await load(true)}catch(e){flash(qs('#voteMsg'),e.message,'notice error')}}
async function endVote(){try{await api('/api/rooms/'+code+'/vote/end',h('POST'));await load(true)}catch(e){flash(qs('#voteMsg'),e.message,'notice error')}}
async function eliminate(id){const name=state.players.find(p=>p.id===id)?.name||'이 학생';if(!confirm(`${name} 학생을 탈락 처리할까요?`))return;try{await api('/api/rooms/'+code+'/eliminate',h('POST',{playerId:id}));await load(true)}catch(e){flash(qs('#voteMsg'),e.message,'notice error')}}
async function nextDay(){try{await api('/api/rooms/'+code+'/day/next',h('POST'));await load(true)}catch(e){flash(qs('#voteMsg'),e.message,'notice error')}}
function saveNight(){const mafiaTargetId=qs('input[name="mafiaNight"]:checked')?.value||null;const doctorTargetId=qs('input[name="doctorNight"]:checked')?.value||null;nightSavePromise=nightSavePromise.catch(()=>{}).then(()=>api('/api/rooms/'+code+'/night/set',h('POST',{mafiaTargetId,doctorTargetId}))).catch(e=>{flash(qs('#nightMsg'),e.message,'notice error');throw e});return nightSavePromise}
async function clearNight(){try{await api('/api/rooms/'+code+'/night/set',h('POST',{mafiaTargetId:null,doctorTargetId:null}));await load(true)}catch(e){flash(qs('#nightMsg'),e.message,'notice error')}}
async function resolveNight(){const m=qs('input[name="mafiaNight"]:checked');if(state.nightCapabilities?.mafiaAlive&&!m&&!state.nightAction?.mafiaTargetId)return flash(qs('#nightMsg'),'마피아가 지목한 학생을 먼저 체크해 주세요.','notice error');if(!confirm('현재 체크한 내용으로 밤 결과를 적용할까요?'))return;try{await saveNight();const r=await api('/api/rooms/'+code+'/night/resolve',h('POST'));if(r.result?.protected)flash(qs('#nightMsg'),'의사가 같은 학생을 보호했습니다. 탈락자는 없습니다.','notice success');else if(r.result?.eliminatedName)flash(qs('#nightMsg'),r.result.eliminatedName+' 학생이 밤에 탈락했습니다.','notice');await load(true)}catch(e){flash(qs('#nightMsg'),e.message,'notice error')}}
qs('#copyUrlBtn').onclick=async()=>{try{await navigator.clipboard.writeText(state.joinUrl);qs('#copyUrlBtn').textContent='복사됨';setTimeout(()=>qs('#copyUrlBtn').textContent='주소 복사',1200)}catch{prompt('아래 주소를 복사하세요.',state.joinUrl)}};qs('#assignBtn').onclick=assign;qs('#teacherRoleBtn').onclick=toggleTeacherRoles;qs('#studentLockBtn').onclick=toggleStudentLock;qs('#resetBtn').onclick=async()=>{if(!confirm('역할과 투표 기록을 모두 초기화할까요? 학생은 방에 그대로 남습니다.'))return;try{await api('/api/rooms/'+code+'/reset',h('POST'));showTeacherRoles=false;await load(true)}catch(e){alert(e.message)}};qs('#deleteBtn').onclick=async()=>{if(!confirm('방을 완전히 종료할까요? 학생들도 더 이상 접속할 수 없습니다.'))return;try{await api('/api/rooms/'+code+'/delete',h('POST'));localStorage.removeItem('mafia_admin_'+code);location.href='/';}catch(e){alert(e.message)}};load(); setInterval(load,1500);
</script></body></html>
