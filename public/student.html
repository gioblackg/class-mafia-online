<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학생 화면 · 우리 반 마피아</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="student-shell"><div class="student-top"><div class="brand" style="justify-content:center"><div class="brand-badge">M</div>우리 반 마피아</div><p class="muted small">내 역할은 나만 보기</p></div><div id="fatal" class="notice error" hidden></div><main id="app" class="stack" hidden><section class="card"><div class="section-title"><div><div class="small muted">방 코드</div><h2 id="roomCode" style="margin-top:2px"></h2></div><span id="dayPill" class="pill"></span></div><div id="identity" class="small muted"></div></section><section id="roleCard" class="card big-role"><div id="roleContent"></div></section><section id="voteCard" class="card"><div id="voteContent"></div><div id="voteMsg" hidden style="margin-top:10px"></div></section></main><div class="footer">친구의 화면을 보지 않고 즐겁게 참여해 주세요 🙂</div></div>
<script src="/common.js"></script><script>
const code=new URLSearchParams(location.search).get('room');let token=localStorage.getItem('mafia_player_'+code);let state=null;let loading=false;let selectedVoteTarget=null;let lastVoteStatus=null;
async function ensureJoin(){if(token)return load();try{await api('/api/rooms/'+code+'/public')}catch(e){return fatal(e.message)}const name=prompt('번호 또는 별명을 입력해 주세요.\n예: 12번 / 반짝이');if(!name){location.href='/';return}try{const r=await api('/api/rooms/'+code+'/join',{method:'POST',body:JSON.stringify({name})});token=r.playerToken;localStorage.setItem('mafia_player_'+code,token);load();}catch(e){fatal(e.message)}}
async function load(){if(loading||!token)return;loading=true;try{state=await api('/api/rooms/'+code+'/me',{headers:{'x-player-token':token}});if(lastVoteStatus!==state.voteStatus){selectedVoteTarget=null;lastVoteStatus=state.voteStatus}if(state.player.hasVoted)selectedVoteTarget=null;render();qs('#app').hidden=false;qs('#fatal').hidden=true}catch(e){if(e.message.includes('방을 찾을 수 없')){fatal(e.message)}else{localStorage.removeItem('mafia_player_'+code);token=null;fatal(e.message)}}finally{loading=false}}function fatal(m){qs('#fatal').textContent=m;qs('#fatal').hidden=false;qs('#app').hidden=true}
function render(){qs('#roomCode').textContent=state.code;qs('#dayPill').textContent=state.day+'일차';qs('#identity').innerHTML=`나는 <b>${escapeHtml(state.player.name)}</b> · ${state.player.alive?'생존 중':'탈락'}`;const rc=qs('#roleCard');if(!state.rolesAssigned){rc.className='card big-role';qs('#roleContent').innerHTML='<div class="role-emoji">🤫</div><h2 style="font-size:28px">역할 배정을 기다려 주세요</h2><p class="muted">모두 입장하면 선생님이 역할을 배정합니다.</p>';}else if(state.roleLocked){rc.className='card big-role role-locked';qs('#roleContent').innerHTML='<div class="role-emoji">🔒</div><h2 style="font-size:28px">역할이 잠겼어요</h2><p class="muted">역할 확인 시간이 끝났습니다. 선생님이 다시 열어 주면 확인할 수 있어요.</p>';}else{const r=state.player.role,m=roleMeta[r];rc.className='card big-role '+r;qs('#roleContent').innerHTML=`<div class="small muted">나의 역할</div><div class="role-emoji">${m.emoji}</div><h2>${m.label}</h2><p class="muted">${m.desc}</p>${r==='mafia'&&state.player.fellowMafia.length?`<div class="notice error"><b>같은 마피아</b><br>${state.player.fellowMafia.map(escapeHtml).join(', ')}</div>`:''}`;}renderVote()}
function renderVote(){const el=qs('#voteContent');const oldChecked=qs('input[name="target"]:checked',el)?.value;if(oldChecked)selectedVoteTarget=oldChecked;if(!state.rolesAssigned){el.innerHTML='<div class="empty">역할 배정 후 투표 기능이 열립니다.</div>';return}if(!state.player.alive){selectedVoteTarget=null;el.innerHTML='<div class="card dead-card"><h2>이번 게임에서 탈락했어요</h2><p>토론과 투표에는 참여하지 않고 조용히 관전해 주세요.</p></div>';return}if(state.voteStatus==='idle'){selectedVoteTarget=null;el.innerHTML=`<div class="status-banner status-wait">${state.day}일차 토론 중</div><p class="muted" style="text-align:center">선생님이 투표를 시작하면 후보가 나타납니다.</p>`;return}if(state.voteStatus==='ended'){selectedVoteTarget=null;const top=(state.result||[]).slice(0,5);el.innerHTML=`<div class="status-banner status-done">${state.day}일차 투표가 끝났습니다.</div>${top.length?'<div class="vote-grid">'+top.map(t=>`<div class="candidate"><div class="small muted">${escapeHtml(t.name)}</div><div class="votes">${t.votes}표</div></div>`).join('')+'</div>':''}`;return}if(state.player.hasVoted){selectedVoteTarget=null;el.innerHTML='<div class="status-banner status-done">✅ 투표를 완료했습니다.</div><p class="muted" style="text-align:center">선생님이 투표를 종료할 때까지 기다려 주세요.</p>';return}if(selectedVoteTarget&&!state.candidates.some(c=>c.id===selectedVoteTarget))selectedVoteTarget=null;el.innerHTML=`<h2>${state.day}일차 마피아 투표</h2><p class="muted">마피아라고 생각하는 친구를 한 명 선택하세요. 자기 자신에게는 투표할 수 없습니다.</p><form id="voteForm">${state.candidates.map(c=>`<input class="candidate-radio" type="radio" name="target" id="c_${c.id}" value="${c.id}" ${selectedVoteTarget===c.id?'checked':''}><label class="vote-option" for="c_${c.id}"><span>${escapeHtml(c.name)}</span><span class="dot"></span></label>`).join('')}<button class="btn btn-primary btn-block" type="submit">이 친구에게 투표하기</button></form>`;qsa('input[name="target"]',el).forEach(x=>x.onchange=()=>{selectedVoteTarget=x.value});qs('#voteForm').onsubmit=vote;}
async function vote(e){e.preventDefault();const target=new FormData(e.target).get('target');if(!target)return flash(qs('#voteMsg'),'투표할 친구를 한 명 선택해 주세요.','notice error');selectedVoteTarget=target;if(!confirm('선택한 친구에게 투표할까요? 한 번 투표하면 바꿀 수 없습니다.'))return;try{await api('/api/rooms/'+code+'/vote',{method:'POST',headers:{'x-player-token':token},body:JSON.stringify({targetId:target})});selectedVoteTarget=null;await load();}catch(err){flash(qs('#voteMsg'),err.message,'notice error')}}
if(!/^\d{6}$/.test(code||''))fatal('올바른 방 주소가 아닙니다.');else ensureJoin(); setInterval(()=>{if(token)load()},1500);
</script></body></html>
