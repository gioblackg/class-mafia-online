<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>학생 화면 · 우리 반 마피아</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="student-shell student-min-shell">
  <div class="student-min-head">
    <div class="brand"><div class="brand-badge">M</div>우리 반 마피아</div>
    <span id="dayPill" class="pill"></span>
  </div>
  <div id="fatal" class="notice error" hidden></div>
  <main id="app" class="stack" hidden>
    <div class="student-identity"><b id="myName"></b><span id="alivePill" class="pill live"></span><span class="small muted">방 <span id="roomCode"></span></span></div>
    <section id="roleCard" class="card student-role-mini" hidden><div id="roleContent"></div></section>
    <section id="actionCard" class="card student-action-card"><div id="actionContent"></div><div id="actionMsg" hidden style="margin-top:10px"></div></section>
  </main>
</div>
<script src="/common.js"></script>
<script>
const params=new URLSearchParams(location.search);
const code=params.get('room');
const previewToken=params.get('previewToken');
const previewKey='mafia_preview_'+code;
if(previewToken){sessionStorage.setItem(previewKey,previewToken);params.delete('previewToken');history.replaceState(null,'',location.pathname+'?'+params.toString())}
let token=sessionStorage.getItem(previewKey)||localStorage.getItem('mafia_player_'+code);
let state=null,loading=false,selectedVoteTarget=null,lastVoteStatus=null;
let nightHoldTimer=null,nightHolding=false,nightActionBusy=false;
async function ensureJoin(){
  if(token)return load();
  try{await api('/api/rooms/'+code+'/public')}catch(e){return fatal(e.message)}
  const name=prompt('번호 또는 별명을 입력해 주세요.\n예: 12번 / 반짝이');
  if(!name){location.href='/';return}
  try{const r=await api('/api/rooms/'+code+'/join',{method:'POST',body:JSON.stringify({name})});token=r.playerToken;localStorage.setItem('mafia_player_'+code,token);load()}catch(e){fatal(e.message)}
}
async function load(){
  if(loading||!token||nightHolding||nightActionBusy)return;loading=true;
  try{
    state=await api('/api/rooms/'+code+'/me',{headers:{'x-player-token':token}});
    if(lastVoteStatus!==state.voteStatus){selectedVoteTarget=null;lastVoteStatus=state.voteStatus}
    if(state.player.hasVoted)selectedVoteTarget=null;
    render();qs('#app').hidden=false;qs('#fatal').hidden=true;
  }catch(e){
    if(e.status===403){
      sessionStorage.removeItem(previewKey);localStorage.removeItem('mafia_player_'+code);token=null;
      fatal('이 기기의 접속 정보를 확인할 수 없습니다. 선생님께 알려 주세요.');
    }else if(e.status===404||e.message.includes('방을 찾을 수 없')){
      fatal(e.message);
    }else{
      reconnectNotice(e.message||'연결이 잠시 끊겼습니다. 자동으로 다시 연결합니다.');
    }
  }finally{loading=false}
}
function fatal(m){qs('#fatal').textContent=m;qs('#fatal').className='notice error';qs('#fatal').hidden=false;qs('#app').hidden=true}
function reconnectNotice(m){const el=qs('#fatal');el.textContent='📶 '+m;el.className='notice';el.hidden=false;if(state)qs('#app').hidden=false}
function render(){
  qs('#roomCode').textContent=state.code;qs('#dayPill').textContent=(state.totalDays?`${state.day}/${state.totalDays}`:state.day)+'일차';qs('#myName').textContent=state.player.name;qs('#alivePill').textContent=state.player.alive?'생존':'탈락';qs('#alivePill').className='pill '+(state.player.alive?'live':'dead');
  renderRole();renderAction();
}
function renderRole(){
  const card=qs('#roleCard'),el=qs('#roleContent');
  if(!state.rolesAssigned||state.roleLocked){card.hidden=true;return}
  card.hidden=false;const r=state.player.role,m=roleMeta[r];card.className='card student-role-mini role-uniform';
  const secretText=r==='mafia'&&state.player.fellowMafia.length?`같은 마피아 · ${state.player.fellowMafia.map(escapeHtml).join(', ')}`:'추가 정보가 없습니다.';
  el.innerHTML=`<div class="role-mini-row role-uniform-row"><div><div class="small muted">나의 역할</div><div class="role-mini-name">${m.label}</div></div></div><button id="roleSecretBtn" class="private-result-btn role-secret-btn" type="button">🔐 비밀 정보 확인</button><div id="roleSecretText" class="private-result-text role-secret-text blurred">${secretText}</div>`;
  const secretBtn=qs('#roleSecretBtn'),secretEl=qs('#roleSecretText');const revealSecret=()=>secretEl.classList.remove('blurred'),hideSecret=()=>secretEl.classList.add('blurred');secretBtn.addEventListener('pointerdown',revealSecret);secretBtn.addEventListener('pointerup',hideSecret);secretBtn.addEventListener('pointerleave',hideSecret);secretBtn.addEventListener('pointercancel',hideSecret);secretBtn.addEventListener('contextmenu',e=>e.preventDefault());
}
function renderAction(){
  const el=qs('#actionContent'),night=state.night||{status:'idle'};
  if(!state.rolesAssigned){el.innerHTML='<div class="action-center"><div class="action-icon">🤫</div><h2>잠시 기다려 주세요</h2><p class="muted">선생님이 역할을 배정하고 있어요.</p></div>';return}
  if(night.status==='open'){renderNightAction(el,night);return}
  if(night.status==='resolved'&&night.privateResult?.kind==='police'){renderPoliceResult(el,night.privateResult);return}
  if(state.status==='finished'){el.innerHTML=`<div class="action-center"><div class="action-icon">🏁</div><h2>게임 종료</h2><p class="muted">${state.totalDays}일간의 게임이 끝났습니다.</p></div>`;return}
  if(!state.player.alive){el.innerHTML='<div class="action-center"><div class="action-icon">👀</div><h2>관전 중</h2><p class="muted">조용히 게임을 지켜봐 주세요.</p></div>';return}
  if(state.voteStatus==='open'){renderVote(el);return}
  if(state.voteStatus==='ended'){el.innerHTML='<div class="action-center"><div class="action-icon">✅</div><h2>투표 완료</h2><p class="muted">선생님의 안내를 기다려 주세요.</p></div>';return}
  el.innerHTML=`<div class="action-center"><div class="action-icon">💬</div><h2>${state.day}일차 토론 중</h2><p class="muted">선생님이 투표나 밤 행동을 시작하면 화면이 바뀝니다.</p>${state.roleLocked?'<div class="small muted lock-note">🔒 역할 확인은 잠겨 있습니다.</div>':''}</div>`;
}
function renderNightAction(el,night){
  if(!state.player.alive){el.innerHTML='<div class="action-center"><div class="action-icon">🌙</div><h2>밤이 진행 중이에요</h2><p class="muted">조용히 기다려 주세요.</p></div>';return}
  if(night.hasActed){el.innerHTML='<div class="action-center"><div class="action-icon">✅</div><h2>밤 행동 완료</h2><p class="muted">태블릿을 그대로 두고 기다려 주세요.</p></div>';return}
  el.innerHTML=`<div class="action-center"><div class="action-icon">🌙</div><h2>한 명을 선택하세요</h2><p class="muted">버튼을 약 1초 동안 꾹 누르면 선택됩니다.</p></div><div class="night-candidate-grid">${night.candidates.map(c=>`<button type="button" class="night-candidate-btn" data-id="${c.id}"><span>${escapeHtml(c.name)}</span><span class="hold-hint">꾹 누르기</span></button>`).join('')}</div>`;
  qsa('.night-candidate-btn',el).forEach(btn=>{btn.addEventListener('pointerdown',e=>startNightHold(e,btn));btn.addEventListener('pointerup',cancelNightHold);btn.addEventListener('pointercancel',cancelNightHold);btn.addEventListener('pointerleave',cancelNightHold);btn.addEventListener('contextmenu',e=>e.preventDefault())});
}
function renderPoliceResult(el,pr){
  el.innerHTML=`<div class="action-center"><div class="action-icon">🔎</div><h2>개인 결과</h2><p class="muted">아래 버튼을 누르고 있는 동안만 결과가 보여요.</p></div><button id="privateResultBtn" class="private-result-btn" type="button">🔐 조사 결과 보기</button><div id="privateResultText" class="private-result-text blurred"><b>${escapeHtml(pr.targetName||'선택한 학생')}</b>은(는)<br><b class="police-answer">${pr.isMafia?'마피아입니다.':'마피아가 아닙니다.'}</b></div>`;
  const btn=qs('#privateResultBtn'),text=qs('#privateResultText');const reveal=()=>text.classList.remove('blurred'),hide=()=>text.classList.add('blurred');btn.addEventListener('pointerdown',reveal);btn.addEventListener('pointerup',hide);btn.addEventListener('pointerleave',hide);btn.addEventListener('pointercancel',hide);btn.addEventListener('contextmenu',e=>e.preventDefault());
}
function startNightHold(e,btn){if(nightActionBusy||nightHoldTimer)return;e.preventDefault();nightHolding=true;btn.classList.add('holding');try{btn.setPointerCapture(e.pointerId)}catch{}nightHoldTimer=setTimeout(()=>{nightHoldTimer=null;submitNightAction(btn.dataset.id,btn)},800)}
function cancelNightHold(){if(nightHoldTimer){clearTimeout(nightHoldTimer);nightHoldTimer=null}nightHolding=false;qsa('.night-candidate-btn').forEach(b=>b.classList.remove('holding'))}
async function submitNightAction(targetId,btn){if(nightActionBusy)return;nightActionBusy=true;nightHolding=false;qsa('.night-candidate-btn').forEach(b=>{b.disabled=true;b.classList.remove('holding')});if(btn)btn.classList.add('chosen');try{state=await api('/api/rooms/'+code+'/night/action',{method:'POST',headers:{'x-player-token':token},body:JSON.stringify({targetId})});render()}catch(e){flash(qs('#actionMsg'),e.message,'notice error');qsa('.night-candidate-btn').forEach(b=>b.disabled=false)}finally{nightActionBusy=false}}
function renderVote(el){
  if(state.player.hasVoted){selectedVoteTarget=null;el.innerHTML='<div class="action-center"><div class="action-icon">✅</div><h2>투표 완료</h2><p class="muted">다른 친구들의 투표를 기다려 주세요.</p></div>';return}
  const oldChecked=qs('input[name="target"]:checked',el)?.value;if(oldChecked)selectedVoteTarget=oldChecked;if(selectedVoteTarget&&!state.candidates.some(c=>c.id===selectedVoteTarget))selectedVoteTarget=null;
  el.innerHTML=`<div class="action-center"><div class="action-icon">🗳️</div><h2>마피아 투표</h2><p class="muted">한 명을 선택하세요.</p></div><form id="voteForm">${state.candidates.map(c=>`<input class="candidate-radio" type="radio" name="target" id="c_${c.id}" value="${c.id}" ${selectedVoteTarget===c.id?'checked':''}><label class="vote-option" for="c_${c.id}"><span>${escapeHtml(c.name)}</span><span class="dot"></span></label>`).join('')}<button class="btn btn-primary btn-block" type="submit">투표하기</button></form>`;
  qsa('input[name="target"]',el).forEach(x=>x.onchange=()=>{selectedVoteTarget=x.value});qs('#voteForm').onsubmit=vote;
}
async function vote(e){e.preventDefault();const target=new FormData(e.target).get('target');if(!target)return flash(qs('#actionMsg'),'한 명을 선택해 주세요.','notice error');selectedVoteTarget=target;if(!confirm('이 친구에게 투표할까요?'))return;try{await api('/api/rooms/'+code+'/vote',{method:'POST',headers:{'x-player-token':token},body:JSON.stringify({targetId:target})});selectedVoteTarget=null;await load()}catch(err){flash(qs('#actionMsg'),err.message,'notice error')}}
if(!/^\d{6}$/.test(code||''))fatal('올바른 방 주소가 아닙니다.');else ensureJoin();
setInterval(()=>{if(token)load()},1500);
</script>
</body>
</html>
